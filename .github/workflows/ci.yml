name: CI
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  backend:
    name: CI / backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install uv
      - working-directory: src/backend
        run: uv sync --frozen
      - working-directory: src/backend
        run: uvx ruff check .
      - working-directory: src/backend
        run: uv run pytest -q

  frontend:
    name: CI / frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: corepack enable
      - working-directory: src/frontend
        run: pnpm install --frozen-lockfile || pnpm install
      - working-directory: src/frontend
        run: pnpm run -s lint || echo "skip lint"
      - working-directory: src/frontend
        run: pnpm run -s test -- --run || echo "skip test"

  e2e:
    name: E2E / playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: corepack enable
      - working-directory: src/frontend
        run: pnpm install --frozen-lockfile || pnpm install
      - working-directory: src/frontend
        run: pnpm exec playwright install --with-deps
      - run: docker compose build backend frontend
      - run: docker compose up -d db redis
      - name: Wait for database
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T db pg_isready -U radb -d radb >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Database did not become ready in time" >&2
          docker compose logs db
          exit 1
      - run: docker compose run --rm backend alembic upgrade head
      - run: docker compose up -d backend frontend
      - name: Wait for services
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://localhost:5173 >/dev/null && curl -fsS http://localhost:8000/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Services did not become ready in time" >&2
          docker compose logs backend frontend
          exit 1
      - working-directory: src/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: pnpm exec playwright test
      - if: failure()
        run: docker compose logs backend frontend db
      - if: always()
        run: docker compose down
